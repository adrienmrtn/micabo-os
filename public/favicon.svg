<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sophia">
  <rect width="100" height="100" rx="24" fill="#F4EEDF"/>
  <!-- Φ : anneau + barre verticale, rose à contour noir -->
  <g fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round">
    <ellipse cx="50" cy="50" rx="26" ry="30"/>
    <line x1="50" y1="14" x2="50" y2="86"/>
  </g>
  <g fill="none" stroke="#E79BC2" stroke-width="9" stroke-linecap="round" stroke-dasharray="0"
     style="mix-blend-mode:normal">
    <ellipse cx="50" cy="50" rx="26" ry="30" stroke-width="5"/>
    <line x1="50" y1="14" x2="50" y2="86" stroke-width="5"/>
  </g>
</svg>
